; /etc/supervisor/conf.d/capstrack-worker.conf
; Sends queued mail and web pushes. deploy.sh restarts it on every update,
; because a running worker keeps the old code and the old .env.
[program:capstrack-worker]
command=php /var/www/capstrack/artisan queue:work --sleep=3 --tries=3 --max-time=3600
user=www-data
numprocs=1
autostart=true
autorestart=true
stopwaitsecs=3600
redirect_stderr=true
stdout_logfile=/var/www/capstrack/storage/logs/worker.log

; Runs duplication checks, one at a time, so students wait their turn instead
; of all timing out together, and mail is not stuck behind a check.
[program:capstrack-checks]
command=php /var/www/capstrack/artisan queue:work --queue=checks --sleep=3 --tries=1 --max-time=3600
user=www-data
numprocs=1
autostart=true
autorestart=true
stopwaitsecs=3600
redirect_stderr=true
stdout_logfile=/var/www/capstrack/storage/logs/checks-worker.log
