# /etc/nginx/sites-available/capstrack  (then symlink into sites-enabled)
server {
    listen 80;
    server_name _;
    root /var/www/capstrack/public;
    index index.php;

    # The biggest upload the app accepts is 25 MB.
    client_max_body_size 32M;

    # Don't announce the nginx version.
    server_tokens off;

    location / {
        # CSS, JS and images are served here without going through Laravel,
        # so the header Laravel adds to its pages has to be added here too.
        add_header X-Content-Type-Options nosniff always;
        try_files $uri $uri/ /index.php?$query_string;
    }

    location ~ \.php$ {
        include snippets/fastcgi-php.conf;
        fastcgi_pass unix:/run/php/php8.4-fpm.sock;
        # A duplication check runs while the page waits for it.
        fastcgi_read_timeout 300;
    }

    location ~ /\.(?!well-known) {
        deny all;
    }
}
