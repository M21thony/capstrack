# CapsTrack: four containers - system, db, ollama, storage.
#   cp deploy/env.production.example .env   (fill it in, set APP_KEY, DB_PASSWORD, DB_ROOT_PASSWORD,
#                                            AWS_ACCESS_KEY_ID, AWS_SECRET_ACCESS_KEY)
#   docker compose up -d --build
services:
  capstrack-system:
    build: .
    env_file: .env
    environment:
      DB_HOST: capstrack-db
      OLLAMA_URL: http://capstrack-ollama:11434
      # Uploaded files go to the storage container, not this one's disk.
      FILES_ON_S3: "true"
      AWS_ENDPOINT: http://capstrack-storage:9000
      AWS_USE_PATH_STYLE_ENDPOINT: "true"
    ports:
      - "80:80"
    volumes:
      - app-storage:/var/www/capstrack/storage
    depends_on:
      capstrack-db:
        condition: service_healthy
      capstrack-storage:
        condition: service_started
    restart: unless-stopped

  capstrack-db:
    image: mysql:8.4
    # The app's tables are all MyISAM (as on the laptop and Azure); InnoDB rejects its foreign keys.
    command: --default-storage-engine=MyISAM
    environment:
      MYSQL_DATABASE: ${DB_DATABASE:-capstrack}
      MYSQL_USER: ${DB_USERNAME:-capstrack}
      MYSQL_PASSWORD: ${DB_PASSWORD}
      MYSQL_ROOT_PASSWORD: ${DB_ROOT_PASSWORD}
    volumes:
      - db-data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-p${DB_ROOT_PASSWORD}"]
      interval: 5s
      timeout: 5s
      retries: 20
    restart: unless-stopped

  capstrack-ollama:
    image: ollama/ollama
    volumes:
      - ollama-models:/root/.ollama
    restart: unless-stopped
    # With an NVIDIA GPU, uncomment:
    # deploy:
    #   resources:
    #     reservations:
    #       devices:
    #         - driver: nvidia
    #           count: all
    #           capabilities: [gpu]

  # Silo: S3 storage, the same release the Azure server runs (deploy/silo.sh).
  # No port is published, so only capstrack-system can reach it.
  capstrack-storage:
    image: pgsty/silo:RELEASE.2026-10-26T00-00-00Z
    command: server /data
    environment:
      MINIO_ROOT_USER: ${AWS_ACCESS_KEY_ID}
      MINIO_ROOT_PASSWORD: ${AWS_SECRET_ACCESS_KEY}
    volumes:
      - storage-data:/data
    restart: unless-stopped

volumes:
  app-storage:
  db-data:
  ollama-models:
  storage-data:
